<script id="tmxUniversalAuthResolveEndV8221">
(function(){
 const root=document.documentElement;
 if(!root.classList.contains('tmx-auth-resolving')) return;
 function hasSession(){ return !!(sessionStorage.getItem('tmx_km_pm_token') || sessionStorage.getItem('tmx_km_admin_token')); }
 function loginVisible(){
   const ids=['login', 'loginBtn'];
   for(const id of ids){
     const e=document.getElementById(id);
     if(e && getComputedStyle(e).display!=='none' && getComputedStyle(e).visibility!=='hidden') return true;
   }
   return false;
 }
 function revealIfReady(){
   if(hasSession()){
     // Wait one frame so the page's own auth routine can switch from login to app.
     requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('tmx-auth-resolving')));
     return true;
   }
   return false;
 }
 if(!revealIfReady()){
   const mo=new MutationObserver(()=>{if(revealIfReady())mo.disconnect()});
   if(document.body) mo.observe(document.body,{subtree:true,childList:true,attributes:true});
   // Genuine auth failure: restore existing legacy login fallback.
   setTimeout(()=>{root.classList.remove('tmx-auth-resolving');mo.disconnect()},12000);
 }
})();
</script>


<script id="v836MultiMonthJs">
(function(){
 function labelMonth(v){const [y,m]=v.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en',{month:'short',year:'numeric'});}
 function months(){
   const out=[],d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+3);
   for(let i=0;i<40;i++){out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));d.setMonth(d.getMonth()-1)}
   return out;
 }
 function init(inp){
   if(inp.dataset.mmReady)return; inp.dataset.mmReady='1'; inp.type='text'; inp.readOnly=true;
   inp.classList.add('tmx-mm-input'); inp.placeholder='Select one or more months';
   const wrap=document.createElement('div');wrap.className='tmx-mm-wrap';
   inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);
   const pop=document.createElement('div');pop.className='tmx-mm-pop';wrap.appendChild(pop);
   function selected(){return new Set(String(inp.value||'').split(',').map(x=>x.trim()).filter(Boolean))}
   function draw(){
     const sel=selected(), vals=months();
     pop.innerHTML='<div class="tmx-mm-head"><b>Select months</b><button type="button" class="tmx-mm-btn mm-clear">Clear</button></div>'+
       '<div class="tmx-mm-list">'+vals.map(v=>'<label class="tmx-mm-item"><input type="checkbox" value="'+v+'" '+(sel.has(v)?'checked':'')+'><span>'+labelMonth(v)+'</span></label>').join('')+'</div>'+
       '<div class="tmx-mm-actions"><button type="button" class="tmx-mm-btn mm-cancel">Cancel</button><button type="button" class="tmx-mm-btn primary mm-done">Done</button></div>';
     pop.querySelector('.mm-clear').onclick=()=>{pop.querySelectorAll('input').forEach(x=>x.checked=false)};
     pop.querySelector('.mm-cancel').onclick=()=>pop.classList.remove('open');
     pop.querySelector('.mm-done').onclick=()=>{
       inp.value=[...pop.querySelectorAll('input:checked')].map(x=>x.value).sort().reverse().join(',');
       pop.classList.remove('open');inp.dispatchEvent(new Event('change',{bubbles:true}));
     };
   }
   inp.addEventListener('click',e=>{e.stopPropagation();draw();pop.classList.toggle('open')});
   pop.addEventListener('click',e=>e.stopPropagation());
   document.addEventListener('click',()=>pop.classList.remove('open'));
 }
 function boot(){document.querySelectorAll('input[data-multimonth]').forEach(init)}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>

<script id="v8323UnifiedPortalLogout">
(function(){
 const PORTAL_LOGIN='https://telecomaxportal.vercel.app/?logout=1';
 function isLogoutTarget(el){
   const b=el&&el.closest?el.closest('button,a'):null;if(!b)return false;
   const id=String(b.id||'').toLowerCase(),txt=String(b.textContent||'').trim().toLowerCase();
   return id==='logout'||id==='logoutbtn'||id==='navadmlogout'||txt==='log out'||txt==='logout'||txt==='admin log out';
 }
 document.addEventListener('click',function(e){
   if(!isLogoutTarget(e.target))return;
   e.preventDefault();e.stopImmediatePropagation();
   try{sessionStorage.clear();}catch(_e){}
   location.replace(PORTAL_LOGIN);
 },true);
})();
</script>
