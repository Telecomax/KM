function uniq(a){return [...new Set((a||[]).filter(Boolean))].sort((x,y)=>x.localeCompare(y))}

function filterState(){return {engineer:$('engineer').value.trim(),driver:$('driver').value.trim(),project:$('project').value.trim()}}
function relationalOptions(kind){
 const q=filterState();
 const rows=(filterSource.combinations||[]).filter(c=>{
   for(const k of ['engineer','driver','project']){
     if(k===kind||!q[k])continue;
     if(!eq(c[k],q[k]))return false;
   }
   return true;
 });
 if(kind==='engineer'){
   // MASTER SOURCE: Engineer Name list from Config Column A.
   const cfg=uniq(filterSource.engineers||[]);
   // With no Driver/Project selection, always show the complete Config Column A list.
   const hasRelation=!!q.driver||!!q.project;
   if(!hasRelation)return cfg;
   // Once another filter is selected, keep Config A as the source and only narrow
   // it to engineers that exist in matching KM combinations.
   const allowed=uniq(rows.map(c=>c.engineer));
   return cfg.filter(e=>allowed.some(v=>eq(v,e)));
 }
 if(kind==='driver'){
   const vals=uniq(rows.map(c=>c.driver).filter(x=>String(x).toLowerCase()!=='rent'));
   const cfg=uniq((filterSource.drivers||[]).filter(x=>String(x).toLowerCase()!=='rent'));
   return vals.length?cfg.filter(d=>vals.some(v=>eq(v,d))):cfg;
 }
 const vals=uniq(rows.map(c=>c.project));

function renderCombo(kind){
 const input=$(kind),list=$(kind+'List'),q=input.value.trim().toLowerCase();

   e.preventDefault();input.value=o.dataset.value;$(kind+'Combo').classList.remove('open');sanitizeRelated(kind);refreshAllCombos();

function sanitizeRelated(changed){

   if(kind===changed)continue;

   if(!relationalOptions(kind).some(x=>eq(x,v)))input.value='';

ectedCount()}

function portalSSOStatus_(title,detail){ document.documentElement.classList.remove('portal-sso-pending');
 let x=document.getElementById('portalSsoStatus');
 if(!x){x=document.createElement('div');x.id='portalSsoStatus';x.className='sso-status';document.body.appendChild(x)}
 x.innerHTML='<div class="sso-status-box"><b>'+title+'</b><span>'+detail+'</span></div>';
}
(async function portalAutoLogin(){
 const m=location.hash.match(/(?:^|[&#])sso=([^&]+)/); if(!m)return;
 const portalToken=decodeURIComponent(m[1]);
 portalSSOStatus_('Signing you in…','Using your Telecomax Operations session.');
 history.replaceState(null,'',location.pathname+location.search);
 try{
  const r=await fetch(URL,{method:'POST',body:JSON.stringify({action:'portalSSO',portalToken,portalRole:'PM'})});
  const d=await r.json();
  if(!d.ok||!d.token){portalSSOStatus_('Single Sign-On failed',d.error||'The KM module rejected the portal session.');return;}
  managementToken=d.token; managementName=d.name||'';
  sessionStorage.setItem('tmx_km_pm_token',managementToken);
  sessionStorage.setItem('tmx_km_pm_name',managementName);
  // portalSso already validated the portal token and created this PM session.
  // Do not call allowanceData here: that API requires a month.
  const x=document.getElementById('portalSsoStatus'); if(x)x.remove();
  $('name').value=managementName;
  auth(true);
 }catch(e){portalSSOStatus_('Single Sign-On connection error',String(e&&e.message||e));console.error('Portal SSO failed',e)}
})();
</script>

<script id="v8323UnifiedPortalLogout">
(function(){
 const PORTAL_LOGIN='https://telecomaxportal.vercel.app/?logout=1';
 function isLogoutTarget(el){
   const b=el&&el.closest?el.closest('button,a'):null;if(!b)return false;
   const id=String(b.id||'').toLowerCase(),txt=String(b.textContent||'').trim().toLowerCase();
   return id==='logout'||id==='logoutbtn'||id==='navadmlogout'||txt==='log out'||txt==='logout'||txt==='admin log out';
 }
 document.addEventListener('click',function(e){
   if(!isLogoutTarget(e.target))return;
   e.preventDefault();e.stopImmediatePropagation();
   try{sessionStorage.clear();}catch(_e){}
   location.replace(PORTAL_LOGIN);
 },true);
})();
</script>
